<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estúdio Digital - Editor</title>
    <!-- Ícone do Sistema (Personalize o caminho da pasta aqui) -->
    <link rel="icon" href="./icon/icone.png" type="image/png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        darkcard: '#1e293b',
                        darkborder: '#334155'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SparkMD5 library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>

    <style>
        html,
        body {
            touch-action: manipulation;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0f172a;
            color: #f8fafc;
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .photo-frame-container {
            position: absolute;
            background: #ffffff;
            padding: 16px 16px 40px 16px;
            border-radius: 4px;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7), 0 10px 15px -5px rgba(0, 0, 0, 0.5);
            transform-origin: center center;
            will-change: transform;
            touch-action: none;
            left: 50%;
            top: 50%;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-8px);
            }

            40%,
            80% {
                transform: translateX(8px);
            }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        @media (max-width: 767px) {
            body {
                display: flex;
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
            }

            header {
                padding: 0.35rem 0.5rem;
                gap: 0.25rem;
            }

            header h1 {
                font-size: 0.85rem;
            }

            aside {
                max-height: 18vh !important;
                padding: 0.35rem !important;
                border-top: 1px solid #334155 !important;
                border-bottom: 1px solid #334155 !important;
            }

            #canvasViewport {
                padding: 2px !important;
                flex: 1 1 auto !important;
                width: 100% !important;
                height: 100% !important;
                overflow: hidden !important;
            }

            .photo-frame-container {
                padding: 4px 4px 18px 4px !important;
            }

            button,
            input,
            select {
                min-height: 32px;
            }

            .tool-btn {
                padding: 0.25rem !important;
            }

            .tool-btn i {
                font-size: 0.75rem !important;
                margin-bottom: 0.05rem !important;
            }

            .tool-btn span {
                font-size: 0.55rem !important;
            }

            #paletteSwatches,
            #recentSwatches {
                grid-template-columns: repeat(8, minmax(0, 1fr)) !important;
                gap: 0.25rem !important;
            }

            #paletteSwatches button,
            #recentSwatches button {
                width: 100% !important;
                height: 24px !important;
            }

            input[type=range] {
                height: 20px;
            }
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 h-screen flex flex-col overflow-hidden font-sans select-none">

    <!-- MODAL DE LOGIN VIA MD5 COM BOTÃO HOME -->
    <div id="loginModal"
        class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
        <div id="loginCard"
            class="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl max-w-md w-full p-6 text-center transform transition-all relative">

            <!-- Botão Home no Login -->
            <a href="index.html"
                class="absolute top-4 left-4 text-slate-400 hover:text-white transition p-2 bg-slate-900/60 rounded-xl border border-slate-700 text-xs flex items-center gap-1.5"
                title="Voltar à Home">
                <i class="fa-solid fa-house"></i>
                <span class="hidden sm:inline">Home</span>
            </a>

            <div
                class="w-16 h-16 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 mt-2 text-2xl border border-indigo-500/30">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-1">Acesso ao Estúdio</h2>
            <p class="text-sm text-slate-400 mb-6">Informe a senha de acesso para liberar as ferramentas.</p>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <input type="password" id="passwordInput" placeholder="Sua senha..."
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 text-white placeholder-slate-500 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-center text-lg font-mono">
                </div>

                <button type="submit" id="loginBtn"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl shadow-lg shadow-indigo-900/40 transition duration-200 flex items-center justify-center gap-2">
                    <span>Entrar no Sistema</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div id="loginStatus" class="mt-4 text-xs font-medium text-slate-400 min-h-[20px]">
                Tentativas restantes: <span id="attemptsText" class="font-bold text-slate-200">5/5</span>
            </div>
        </div>
    </div>

    <!-- CABEÇALHO -->
    <header
        class="bg-slate-800 border-b border-slate-700/80 px-3 py-2 flex items-center justify-between z-10 flex-wrap gap-2">
        <div class="flex items-center gap-2">
            <!-- Botão Home no Header -->
            <a href="index.html"
                class="p-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg transition border border-slate-600 flex items-center justify-center"
                title="Voltar à Home">
                <i class="fa-solid fa-house text-sm"></i>
            </a>

            <div
                class="bg-indigo-600 text-white p-2 rounded-xl flex items-center justify-center shadow-md shadow-indigo-900/30">
                <i class="fa-solid fa-palette text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-white text-base leading-tight">Estúdio Digital</h1>
                <p class="text-[10px] text-slate-400 hidden sm:block">ColoriStudio Pro</p>
            </div>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2">
            <label
                class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-lg transition flex items-center gap-1.5 border border-slate-600"
                title="Carregar foto para desenhar">
                <i class="fa-solid fa-upload text-indigo-400"></i>
                <span class="hidden sm:inline">Carregar Foto</span>
                <input type="file" id="imageLoader" accept="image/*" class="hidden">
            </label>

            <label id="refUploadLabel"
                class="cursor-pointer bg-slate-700/50 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-medium px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-lg transition flex items-center gap-1.5 border border-slate-600"
                title="Carregar imagem original separada para conferência">
                <i class="fa-solid fa-image text-emerald-400"></i>
                <span class="hidden sm:inline">Foto Original</span>
                <input type="file" id="referenceImageLoader" accept="image/*" class="hidden">
            </label>

            <button id="toggleOriginalBtn" onclick="toggleOriginalView()"
                class="p-2 bg-slate-700/50 hover:bg-slate-700 text-slate-300 hover:text-white rounded-lg transition border border-slate-600 relative opacity-50 cursor-not-allowed"
                title="Mostra/Oculta a imagem original" disabled>
                <i id="eyeIcon" class="fa-solid fa-eye-slash"></i>
            </button>

            <button onclick="saveProjectFile()"
                class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-lg transition flex items-center gap-1.5 shadow-sm"
                title="Salvar Projeto em Arquivo">
                <i class="fa-solid fa-file-arrow-down"></i>
                <span class="hidden sm:inline">Salvar Projeto</span>
            </button>

            <label
                class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-lg transition flex items-center gap-1.5 border border-slate-600"
                title="Carregar Projeto Salvo">
                <i class="fa-solid fa-file-arrow-up text-indigo-400"></i>
                <span class="hidden sm:inline">Carregar Projeto</span>
                <input type="file" id="projectLoader" accept=".json" class="hidden">
            </label>

            <button id="undoBtn" onclick="undo()"
                class="p-2 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg transition disabled:opacity-30"
                title="Desfazer (Ctrl+Z)">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button id="redoBtn" onclick="redo()"
                class="p-2 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg transition disabled:opacity-30"
                title="Refazer (Ctrl+Y)">
                <i class="fa-solid fa-rotate-right"></i>
            </button>

            <div class="h-5 w-[1px] bg-slate-700 mx-0.5"></div>

            <button onclick="clearPaintLayer()" class="p-2 text-amber-400 hover:bg-amber-950/40 rounded-lg transition"
                title="Limpar Cores">
                <i class="fa-solid fa-eraser"></i>
            </button>
            <button onclick="exportCanvas()"
                class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-lg transition flex items-center gap-1.5 shadow-sm"
                title="Salvar Imagem Final (PNG)">
                <i class="fa-solid fa-download"></i>
                <span class="hidden sm:inline">Salvar Arte</span>
            </button>

            <button onclick="logout()"
                class="p-2 text-slate-400 hover:text-red-400 hover:bg-red-950/40 rounded-lg transition ml-1"
                title="Bloquear / Sair">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <!-- MAIN BODY -->
    <div class="flex-1 flex overflow-hidden flex-col md:flex-row relative">

        <!-- PAINEL DE FERRAMENTAS ESQUERDA -->
        <aside
            class="w-full md:w-64 bg-slate-800 border-b md:border-b-0 md:border-r border-slate-700/80 flex flex-col p-3 overflow-y-auto max-h-[35vh] md:max-h-full z-10 shadow-sm shrink-0">

            <div class="mb-4">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Modo de
                    Pintura</label>
                <div class="grid grid-cols-4 md:grid-cols-2 gap-1.5">
                    <button onclick="setTool('brush')" id="tool-brush"
                        class="tool-btn flex flex-col items-center justify-center p-2 rounded-xl border border-slate-700 hover:bg-slate-700/50 text-slate-300 transition">
                        <i class="fa-solid fa-paint-brush text-base mb-1"></i>
                        <span class="text-[11px] font-medium">Pincel</span>
                    </button>
                    <button onclick="setTool('fill')" id="tool-fill"
                        class="tool-btn flex flex-col items-center justify-center p-2 rounded-xl border border-slate-700 hover:bg-slate-700/50 text-slate-300 transition">
                        <i class="fa-solid fa-fill-drip text-base mb-1"></i>
                        <span class="text-[11px] font-medium">Balde</span>
                    </button>
                    <button onclick="setTool('eyedropper')" id="tool-eyedropper"
                        class="tool-btn flex flex-col items-center justify-center p-2 rounded-xl border border-slate-700 hover:bg-slate-700/50 text-slate-300 transition">
                        <i class="fa-solid fa-eye-dropper text-base mb-1"></i>
                        <span class="text-[11px] font-medium">Conta-gotas</span>
                    </button>
                    <button onclick="setTool('pan')" id="tool-pan"
                        class="tool-btn flex flex-col items-center justify-center p-2 rounded-xl border border-slate-700 bg-indigo-600/20 border-indigo-500 text-indigo-400 transition">
                        <i class="fa-solid fa-hand text-base mb-1"></i>
                        <span class="text-[11px] font-medium">Mover</span>
                    </button>
                </div>
            </div>

            <div id="brushStyleSection" class="mb-4 hidden">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Estilo de
                    Pincel</label>
                <select id="brushType" onchange="setBrushType(this.value)"
                    class="w-full p-2 text-xs border border-slate-700 rounded-lg outline-none focus:border-indigo-500 bg-slate-900 text-slate-200">
                    <option value="free">Pincel Livre (ão)</option>
                    <option value="crayon">Giz de Cera</option>
                    <option value="watercolor">Aquarela</option>
                    <option value="spray">Spray / Aerógrafo</option>
                    <option value="rainbow">Pincel Arco-Íris</option>
                    <option value="glow">Efeito Neon / Glow</option>
                </select>
            </div>

            <div id="fillStyleSection" class="mb-4 hidden">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Efeito do
                    Preenchimento</label>
                <select id="fillType" onchange="setFillType(this.value)"
                    class="w-full p-2 text-xs border border-slate-700 rounded-lg outline-none focus:border-indigo-500 bg-slate-900 text-slate-200">
                    <option value="solid">Liso / Sólido</option>
                    <option value="crayon">Efeito Giz de Cera</option>
                    <option value="spray">Efeito Granulado (Spray)</option>
                    <option value="watercolor">Efeito Aquarela</option>
                </select>
            </div>

            <div class="space-y-3 mb-4 bg-slate-900/60 p-3 rounded-xl border border-slate-700/60">
                <div>
                    <div class="flex justify-between text-xs text-slate-300 mb-1">
                        <span>Tamanho</span>
                        <span id="sizeVal" class="font-mono text-indigo-400">15px</span>
                    </div>
                    <input type="range" id="brushSize" min="2" max="100" value="15" oninput="updateBrushParams()"
                        class="w-full accent-indigo-500 bg-slate-700">
                </div>
                <div>
                    <div class="flex justify-between text-xs text-slate-300 mb-1">
                        <span>Opacidade</span>
                        <span id="opacityVal" class="font-mono text-indigo-400">100%</span>
                    </div>
                    <input type="range" id="brushOpacity" min="10" max="100" value="100" oninput="updateBrushParams()"
                        class="w-full accent-indigo-500 bg-slate-700">
                </div>
                <div id="toleranceContainer" class="hidden">
                    <div class="flex justify-between text-xs text-slate-300 mb-1">
                        <span>Sensibilidade da Borda</span>
                        <span id="toleranceVal" class="font-mono text-indigo-400">30</span>
                    </div>
                    <input type="range" id="fillTolerance" min="5" max="120" value="30"
                        oninput="document.getElementById('toleranceVal').innerText = this.value"
                        class="w-full accent-indigo-500 bg-slate-700">
                </div>
            </div>

            <div class="mt-auto pt-3 border-t border-slate-700">
                <button onclick="toggleLineSettings()"
                    class="flex items-center justify-between w-full text-xs font-semibold text-slate-400 hover:text-slate-200">
                    <span>Ajustes de Foto / Desenho</span>
                    <i class="fa-solid fa-sliders text-indigo-400"></i>
                </button>

                <div id="lineSettings" class="mt-3 space-y-2 hidden">
                    <div>
                        <div class="flex justify-between text-[11px] text-slate-400">
                            <span>Espessura/Força da Borda</span>
                            <span id="edgeThreshVal" class="text-indigo-400 font-mono">100</span>
                        </div>
                        <input type="range" id="edgeThreshold" min="10" max="220" value="100"
                            onchange="processImageLines()" class="w-full accent-indigo-500 bg-slate-700">
                    </div>
                    <div class="flex items-center justify-between text-[11px] text-slate-300 pt-1">
                        <span>Inverter Contornos</span>
                        <input type="checkbox" id="invertLines" onchange="processImageLines()"
                            class="rounded accent-indigo-500">
                    </div>
                </div>
            </div>
        </aside>

        <!-- ÁREA CENTRAL DO CANVAS -->
        <main class="flex-1 bg-slate-950 relative overflow-hidden flex items-center justify-center p-2 sm:p-6"
            id="canvasViewport">

            <div id="frameWrapper" class="photo-frame-container cursor-grab">
                <div id="canvasStack" class="relative overflow-hidden bg-white">
                    <img id="bgOriginalImg"
                        class="absolute top-0 left-0 w-full h-full object-cover pointer-events-none z-10"
                        style="display: none;" alt="Original">
                    <canvas id="paintCanvas" class="absolute top-0 left-0"></canvas>
                    <canvas id="lineCanvas" class="relative top-0 left-0 pointer-events-none"
                        style="mix-blend-mode: multiply;"></canvas>
                </div>
                <div class="text-center mt-2 font-serif text-slate-400 text-xs italic tracking-wide select-none">
                    Foto Original
                </div>
            </div>

            <div
                class="absolute bottom-4 right-4 bg-slate-800/90 backdrop-blur rounded-xl shadow-lg border border-slate-700 p-1 flex items-center gap-1 z-20">
                <button onclick="zoomIn()"
                    class="p-2 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg transition">
                    <i class="fa-solid fa-plus text-xs"></i>
                </button>
                <span id="zoomVal" class="text-xs font-mono px-1 min-w-[45px] text-center text-indigo-400">100%</span>
                <button onclick="zoomOut()"
                    class="p-2 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg transition">
                    <i class="fa-solid fa-minus text-xs"></i>
                </button>
                <button onclick="resetZoom()"
                    class="p-2 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg transition border-l border-slate-700">
                    <i class="fa-solid fa-expand text-xs"></i>
                </button>
            </div>
        </main>

        <!-- PAINEL DE CORES DIREITA -->
        <aside
            class="w-full md:w-64 bg-slate-800 border-t md:border-t-0 md:border-l border-slate-700/80 flex flex-col p-3 overflow-y-auto max-h-[35vh] md:max-h-full z-10 shadow-sm shrink-0">

            <div class="mb-4 bg-slate-900/60 p-3 rounded-xl border border-slate-700/60 flex items-center gap-3">
                <div class="relative">
                    <input type="color" id="nativeColorPicker" value="#3b82f6" onchange="setColor(this.value)"
                        class="opacity-0 absolute inset-0 w-full h-full cursor-pointer">
                    <div id="currentColorPreview"
                        class="w-12 h-12 rounded-xl shadow-inner border-2 border-slate-600 ring-2 ring-slate-800"
                        style="background-color: #3b82f6;"></div>
                </div>
                <div class="flex-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Código
                        HEX</label>
                    <div class="flex items-center gap-1">
                        <span class="text-slate-500 font-mono text-sm">#</span>
                        <input type="text" id="hexInput" value="3B82F6" maxlength="6"
                            oninput="handleHexInput(this.value)"
                            class="w-full font-mono text-xs uppercase px-2 py-1 bg-slate-800 border border-slate-700 text-white rounded outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Paletas Prontas</label>
                    <select id="paletteSelect" onchange="loadPalette(this.value)"
                        class="text-xs border-none bg-slate-900 text-slate-300 rounded px-2 py-1 font-medium outline-none">
                        <option value="basic">Básica</option>
                        <option value="pastel">Pastel</option>
                        <option value="skin">Tons de Pele</option>
                        <option value="nature">Natureza</option>
                        <option value="neon">Neon</option>
                        <option value="vintage">Vintage</option>
                    </select>
                </div>
                <div id="paletteSwatches" class="grid grid-cols-6 gap-1.5"></div>
            </div>

            <div>
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Cores
                    Recentes</label>
                <div id="recentSwatches" class="grid grid-cols-6 gap-1.5"></div>
            </div>
        </aside>
    </div>

    <!-- JAVASCRIPT PRINCIPAL -->
    <script>
        const REQUIRED_MD5_HASH = 'b4fbd32c3430734082d5232ae4a83759';
        const MAX_ATTEMPTS = 5;
        const LOCKOUT_TIME = 60 * 1000;

        let failedAttempts = parseInt(localStorage.getItem('colori_attempts') || '0');
        let lockoutUntil = parseInt(localStorage.getItem('colori_lockout') || '0');

        let activeTool = 'pan';
        let currentBrushType = 'free';
        let currentFillType = 'solid';
        let activeColor = '#3b82f6';
        let brushSize = 15;
        let brushOpacity = 1.0;

        let recentColors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ffffff'];

        const PALETTES = {
            basic: ['#000000', '#ffffff', '#ef4444', '#f97316', '#f59e0b', '#10b981', '#06b6d4', '#3b82f6', '#6366f1', '#8b5cf6', '#ec4899', '#78350f'],
            pastel: ['#fecdd3', '#fde68a', '#a7f3d0', '#bae6fd', '#c7d2fe', '#fbcfe8', '#fed7aa', '#e9d5ff', '#d9f99d', '#ccfbf1'],
            skin: ['#fdf0ed', '#ffdfc4', '#e0ac69', '#c68642', '#8d5524', '#523218', '#3c200c', '#201007'],
            nature: ['#15803d', '#22c55e', '#86efac', '#155e75', '#0284c7', '#7dd3fc', '#b45309', '#d97706', '#fef08a', '#713f12'],
            neon: ['#ff0055', '#ff5000', '#ffcc00', '#00ff66', '#00ffff', '#0066ff', '#cc00ff', '#ff00cc'],
            vintage: ['#2b2d42', '#8d99ae', '#edf2f4', '#ef233c', '#d90429', '#6b705c', '#a5a58d', '#ffe8d6', '#b7b7a4', '#ddbea9']
        };

        let paintCanvas, paintCtx, lineCanvas, lineCtx;
        let loadedImage = null;
        let hasReferenceImage = false;
        let isShowingOriginal = false;

        let zoomScale = 1.0;
        let panX = 0, panY = 0;
        let isDraggingPan = false;
        let panStartX = 0, panStartY = 0;

        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let rainbowHue = 0;

        let undoStack = [];
        let redoStack = [];
        const MAX_HIST = 15;

        function checkLockout() {
            const now = Date.now();
            if (now < lockoutUntil) {
                const remainingSecs = Math.ceil((lockoutUntil - now) / 1000);
                document.getElementById('passwordInput').disabled = true;
                document.getElementById('loginBtn').disabled = true;
                document.getElementById('attemptsText').innerHTML = `<span class="text-red-400 font-bold">Bloqueado! Aguarde ${remainingSecs}s</span>`;
                setTimeout(checkLockout, 1000);
                return true;
            } else {
                document.getElementById('passwordInput').disabled = false;
                document.getElementById('loginBtn').disabled = false;
                updateAttemptsUI();
                return false;
            }
        }

        function updateAttemptsUI() {
            const remaining = MAX_ATTEMPTS - failedAttempts;
            document.getElementById('attemptsText').innerText = `${remaining}/${MAX_ATTEMPTS}`;
        }

        function handleLogin(e) {
            e.preventDefault();
            if (checkLockout()) return;

            const inputPass = document.getElementById('passwordInput').value;
            const inputHash = SparkMD5.hash(inputPass);

            if (inputHash === REQUIRED_MD5_HASH) {
                failedAttempts = 0;
                localStorage.setItem('colori_attempts', '0');
                sessionStorage.setItem('colori_auth', 'true');
                document.getElementById('loginModal').classList.add('hidden');
            } else {
                failedAttempts++;
                localStorage.setItem('colori_attempts', failedAttempts.toString());

                const card = document.getElementById('loginCard');
                card.classList.add('animate-shake');
                setTimeout(() => card.classList.remove('animate-shake'), 400);

                if (failedAttempts >= MAX_ATTEMPTS) {
                    lockoutUntil = Date.now() + LOCKOUT_TIME;
                    localStorage.setItem('colori_lockout', lockoutUntil.toString());
                    failedAttempts = 0;
                    localStorage.setItem('colori_attempts', '0');
                    checkLockout();
                } else {
                    updateAttemptsUI();
                    document.getElementById('passwordInput').value = '';
                    document.getElementById('passwordInput').focus();
                }
            }
        }

        function logout() {
            sessionStorage.removeItem('colori_auth');
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('passwordInput').value = '';
        }

        function setCanvasDimensions(width, height) {
            paintCanvas.width = lineCanvas.width = width;
            paintCanvas.height = lineCanvas.height = height;

            const stack = document.getElementById('canvasStack');
            stack.style.width = width + 'px';
            stack.style.height = height + 'px';

            resetZoom();
        }

        function resetZoom() {
            const viewport = document.getElementById('canvasViewport');
            const vw = viewport.clientWidth - 32;
            const vh = viewport.clientHeight - 32;

            if (!paintCanvas.width) return;

            const scaleX = vw / paintCanvas.width;
            const scaleY = vh / paintCanvas.height;
            zoomScale = Math.min(scaleX, scaleY, 1.0);

            panX = 0;
            panY = 0;
            applyTransform();
        }

        function applyTransform() {
            const frame = document.getElementById('frameWrapper');
            frame.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${zoomScale})`;
            document.getElementById('zoomVal').innerText = `${Math.round(zoomScale * 100)}%`;
        }

        function zoomIn() { zoomScale = Math.min(zoomScale * 1.2, 5.0); applyTransform(); }
        function zoomOut() { zoomScale = Math.max(zoomScale / 1.2, 0.2); applyTransform(); }

        function setupImageLoaders() {
            document.getElementById('imageLoader').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        loadedImage = img;
                        let w = img.width, h = img.height;
                        const maxDim = 1200;
                        if (w > maxDim || h > maxDim) {
                            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                            else { w = Math.round((w * maxDim) / h); h = maxDim; }
                        }
                        setCanvasDimensions(w, h);
                        processImageLines();
                        clearPaintLayer(false);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);

        function loadDefaultImageFromFile() {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                loadedImage = img;
                let w = img.width, h = img.height;
                const maxDim = 1200;
                if (w > maxDim || h > maxDim) {
                    if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                    else { w = Math.round((w * maxDim) / h); h = maxDim; }
                }
                setCanvasDimensions(w, h);
                processImageLines();
                clearPaintLayer(false);
            };
            img.onerror = () => {
                loadDefaultTemplate();
            };
            img.src = 'foto-padrao.png';
        }

        function loadDefaultTemplate() {
            const w = 800, h = 800;
            setCanvasDimensions(w, h);

            lineCtx.clearRect(0, 0, w, h);
            lineCtx.fillStyle = '#ffffff';
            lineCtx.fillRect(0, 0, w, h);

            lineCtx.strokeStyle = '#000000';
            lineCtx.lineWidth = 4;
            lineCtx.beginPath();

            const cx = w / 2, cy = h / 2;
            for (let i = 0; i < 12; i++) {
                const angle = (i * Math.PI) / 6;
                const x = cx + Math.cos(angle) * 180;
                const y = cy + Math.sin(angle) * 180;
                lineCtx.moveTo(cx, cy);
                lineCtx.arc(x, y, 90, 0, Math.PI * 2);
            }
            lineCtx.stroke();
            lineCtx.strokeRect(20, 20, w - 40, h - 40);

            clearPaintLayer(false);
        }

        function processImageLines() {
            if (!loadedImage) return;

            const w = lineCanvas.width, h = lineCanvas.height;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w; tempCanvas.height = h;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(loadedImage, 0, 0, w, h);

            let imgData;
            try {
                imgData = tempCtx.getImageData(0, 0, w, h);
            } catch (err) {
                console.warn('CORS restriction on image pixel reading fallback applied:', err);
                loadDefaultTemplate();
                return;
            }

            const data = imgData.data;
            const threshold = parseInt(document.getElementById('edgeThreshold').value);
            const invert = document.getElementById('invertLines').checked;

            const gray = new Uint8ClampedArray(w * h);
            for (let i = 0; i < data.length; i += 4) {
                gray[i / 4] = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
            }

            const output = lineCtx.createImageData(w, h);
            const outData = output.data;

            for (let y = 1; y < h - 1; y++) {
                for (let x = 1; x < w - 1; x++) {
                    const idx = y * w + x;
                    const gx = -gray[idx - w - 1] + gray[idx - w + 1] - 2 * gray[idx - 1] + 2 * gray[idx + 1] - gray[idx + w - 1] + gray[idx + w + 1];
                    const gy = -gray[idx - w - 1] - 2 * gray[idx - w] - gray[idx - w + 1] + gray[idx + w - 1] + 2 * gray[idx + w] + gray[idx + w + 1];
                    let mag = Math.sqrt(gx * gx + gy * gy);

                    let isLine = mag > threshold;
                    if (invert) isLine = !isLine;

                    const oIdx = idx * 4;
                    if (isLine) {
                        outData[oIdx] = 0;
                        outData[oIdx + 1] = 0;
                        outData[oIdx + 2] = 0;
                        outData[oIdx + 3] = 255;
                    } else {
                        outData[oIdx] = 255;
                        outData[oIdx + 1] = 255;
                        outData[oIdx + 2] = 255;
                        outData[oIdx + 3] = 0;
                    }
                }
            }
            lineCtx.putImageData(output, 0, 0);
        }

        function saveState() {
            if (undoStack.length >= MAX_HIST) undoStack.shift();
            undoStack.push(paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height));
            redoStack = [];
            document.getElementById('undoBtn').disabled = false;
            document.getElementById('redoBtn').disabled = true;
        }

        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push(paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height));
            const prev = undoStack.pop();
            paintCtx.putImageData(prev, 0, 0);
            document.getElementById('redoBtn').disabled = false;
            if (undoStack.length === 0) document.getElementById('undoBtn').disabled = true;
        }

        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push(paintCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height));
            const next = redoStack.pop();
            paintCtx.putImageData(next, 0, 0);
            document.getElementById('undoBtn').disabled = false;
            if (redoStack.length === 0) document.getElementById('redoBtn').disabled = true;
        }

        function setupCanvasEvents() {
            const viewport = document.getElementById('canvasViewport');
            const frame = document.getElementById('frameWrapper');

            viewport.addEventListener('pointerdown', (e) => {
                if (activeTool === 'pan' || e.button === 1 || e.shiftKey) {
                    isDraggingPan = true;
                    panStartX = e.clientX - panX;
                    panStartY = e.clientY - panY;
                    frame.style.cursor = 'grabbing';
                    return;
                }

                if (isShowingOriginal) return;

                const rect = paintCanvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / zoomScale;
                const y = (e.clientY - rect.top) / zoomScale;

                if (x < 0 || y < 0 || x >= paintCanvas.width || y >= paintCanvas.height) return;

                if (activeTool === 'eyedropper') {
                    pickColor(Math.floor(x), Math.floor(y));
                    return;
                }

                if (activeTool === 'fill') {
                    saveState();
                    floodFill(Math.floor(x), Math.floor(y), activeColor);
                    return;
                }

                if (activeTool === 'brush') {
                    saveState();
                    isDrawing = true;
                    lastX = x;
                    lastY = y;
                    drawBrush(x, y, x, y);
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (isDraggingPan) {
                    panX = e.clientX - panStartX;
                    panY = e.clientY - panStartY;
                    applyTransform();
                    return;
                }

                if (isShowingOriginal || !isDrawing) return;

                const rect = paintCanvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / zoomScale;
                const y = (e.clientY - rect.top) / zoomScale;

                drawBrush(lastX, lastY, x, y);
                lastX = x;
                lastY = y;
            });

            window.addEventListener('pointerup', () => {
                if (isDraggingPan) {
                    isDraggingPan = false;
                    frame.style.cursor = activeTool === 'pan' ? 'grab' : 'crosshair';
                }
                isDrawing = false;
            });
        }

        function pickColor(x, y) {
            if (x < 0 || y < 0 || x >= paintCanvas.width || y >= paintCanvas.height) return;
            const pData = paintCtx.getImageData(x, y, 1, 1).data;
            const lData = lineCtx.getImageData(x, y, 1, 1).data;

            let r = pData[0], g = pData[1], b = pData[2], a = pData[3];
            if (a === 0 && lData[3] > 128) {
                r = lData[0]; g = lData[1]; b = lData[2];
            }
            const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            setColor(hex);
            setTool('brush');
        }

        function drawBrush(x1, y1, x2, y2) {
            paintCtx.save();
            paintCtx.globalAlpha = brushOpacity;
            paintCtx.strokeStyle = activeColor;
            paintCtx.fillStyle = activeColor;
            paintCtx.lineWidth = brushSize;
            paintCtx.lineCap = 'round';
            paintCtx.lineJoin = 'round';

            if (currentBrushType === 'free') {
                paintCtx.beginPath();
                paintCtx.moveTo(x1, y1);
                paintCtx.lineTo(x2, y2);
                paintCtx.stroke();
            } else if (currentBrushType === 'crayon') {
                const dist = Math.hypot(x2 - x1, y2 - y1);
                const steps = Math.max(1, Math.floor(dist / 2));
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const cx = x1 + (x2 - x1) * t;
                    const cy = y1 + (y2 - y1) * t;
                    paintCtx.fillRect(cx + (Math.random() - 0.5) * brushSize, cy + (Math.random() - 0.5) * brushSize, 2, 2);
                }
            } else if (currentBrushType === 'watercolor') {
                paintCtx.globalAlpha = brushOpacity * 0.15;
                paintCtx.beginPath();
                paintCtx.arc(x2, y2, brushSize, 0, Math.PI * 2);
                paintCtx.fill();
            } else if (currentBrushType === 'spray') {
                const density = brushSize * 2;
                for (let i = 0; i < density; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * brushSize;
                    paintCtx.fillRect(x2 + Math.cos(angle) * radius, y2 + Math.sin(angle) * radius, 1.5, 1.5);
                }
            } else if (currentBrushType === 'rainbow') {
                rainbowHue = (rainbowHue + 5) % 360;
                paintCtx.strokeStyle = `hsl(${rainbowHue}, 100%, 50%)`;
                paintCtx.beginPath();
                paintCtx.moveTo(x1, y1);
                paintCtx.lineTo(x2, y2);
                paintCtx.stroke();
            } else if (currentBrushType === 'glow') {
                paintCtx.shadowBlur = brushSize / 2;
                paintCtx.shadowColor = activeColor;
                paintCtx.beginPath();
                paintCtx.moveTo(x1, y1);
                paintCtx.lineTo(x2, y2);
                paintCtx.stroke();
            }
            paintCtx.restore();
        }

        function floodFill(startX, startY, fillColorHex) {
            const w = paintCanvas.width;
            const h = paintCanvas.height;
            if (startX < 0 || startY < 0 || startX >= w || startY >= h) return;

            const colorR = parseInt(fillColorHex.slice(1, 3), 16);
            const colorG = parseInt(fillColorHex.slice(3, 5), 16);
            const colorB = parseInt(fillColorHex.slice(5, 7), 16);
            const userTolerance = parseInt(document.getElementById('fillTolerance').value);

            const paintImgData = paintCtx.getImageData(0, 0, w, h);
            const lineImgData = lineCtx.getImageData(0, 0, w, h);
            const pData = paintImgData.data;
            const lData = lineImgData.data;

            const startIndex = (startY * w + startX) * 4;
            const startR = pData[startIndex];
            const startG = pData[startIndex + 1];
            const startB = pData[startIndex + 2];
            const startA = pData[startIndex + 3];

            if (startR === colorR && startG === colorG && startB === colorB && startA === Math.round(brushOpacity * 255)) return;
            if (lData[startIndex + 3] > 40 && lData[startIndex] < 100) return;

            const queue = [[startX, startY]];
            const visited = new Uint8Array(w * h);

            while (queue.length > 0) {
                const [x, y] = queue.pop();
                const idx = y * w + x;
                if (visited[idx]) continue;
                visited[idx] = 1;

                const pIdx = idx * 4;
                const lineAlpha = lData[pIdx + 3];
                const lineR = lData[pIdx];
                if (lineAlpha > 30 && lineR < 150) continue;

                const curR = pData[pIdx];
                const curG = pData[pIdx + 1];
                const curB = pData[pIdx + 2];

                const diff = Math.abs(curR - startR) + Math.abs(curG - startG) + Math.abs(curB - startB);
                if (diff > userTolerance) continue;

                pData[pIdx] = colorR;
                pData[pIdx + 1] = colorG;
                pData[pIdx + 2] = colorB;
                pData[pIdx + 3] = Math.round(brushOpacity * 255);

                if (x > 0 && !visited[idx - 1]) queue.push([x - 1, y]);
                if (x < w - 1 && !visited[idx + 1]) queue.push([x + 1, y]);
                if (y > 0 && !visited[idx - w]) queue.push([x, y - 1]);
                if (y < h - 1 && !visited[idx + w]) queue.push([x, y + 1]);
            }

            paintCtx.putImageData(paintImgData, 0, 0);
        }
